spring:
  application:
    name: JiGou
  profiles:
    active:
      - dev
  # session 配置
  session:
    #    store-type: redis spring boot3.x之后移除了该配置
    # session 30 天过期
    timeout: 2592000

server:
  port: 8181
  servlet:
    context-path: /api

mybatis:
  configuration:
    log-impl: org.apache.ibatis.logging.stdout.StdOutImpl
logging:
  level:
    com.simple.jigou.mapper: info

# 对接knife4j接口文档，springdoc-openapi项目配置
springdoc:
  group-configs:
    - group: 'default'
      packages-to-scan:
        - com.simple.jigou.controller
# knife4j的增强配置，不需要增强可以不配
knife4j:
  enable: true
  setting:
    language: zh_cn