spring:
  application:
    name: JiGou
server:
  port: 8181
  servlet:
    context-path: /api


# 对接knife4j接口文档，springdoc-openapi项目配置
springdoc:
  group-configs:
    - group: 'default'
      packages-to-scan:
        - com.simple.jigou.controller
# knife4j的增强配置，不需要增强可以不配
knife4j:
  enable: true
  setting:
    language: zh_cn